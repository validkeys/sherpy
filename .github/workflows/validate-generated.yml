name: Validate Generated Content

on:
  push:
    branches: [main, feat/**, fix/**]
  pull_request:
    branches: [main]

jobs:
  check-generated:
    name: Check Generated Files Up-to-Date
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run go generate
        run: make generate

      - name: Check for uncommitted changes
        run: |
          STALE=0
          if ! git diff --exit-code prompt/content_generated.go; then
            echo ""
            echo "❌ ERROR: prompt/content_generated.go is stale!"
            echo ""
            echo "The embedded prompt content does not match the skill files."
            echo ""
            echo "To fix this:"
            echo "  1. Run: make generate"
            echo "  2. Commit: git add prompt/content_generated.go"
            echo "  3. Push your changes"
            echo ""
            STALE=1
          fi
          if ! git diff --exit-code spec/content_generated.go; then
            echo ""
            echo "❌ ERROR: spec/content_generated.go is stale!"
            echo ""
            echo "The embedded specification content does not match docs/specifications/."
            echo ""
            echo "To fix this:"
            echo "  1. Run: make generate"
            echo "  2. Commit: git add spec/content_generated.go"
            echo "  3. Push your changes"
            echo ""
            STALE=1
          fi
          if [ "$STALE" -ne 0 ]; then
            echo "Embedded content is out of sync with its sources."
            exit 1
          fi

      - name: Success message
        run: |
          echo "✅ Generated content is up-to-date"
          echo "Skills and specs are in sync with embedded content"
