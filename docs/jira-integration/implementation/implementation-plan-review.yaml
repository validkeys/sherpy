  warnings: []

  info:
    - id: INFO-001
      category: best_practices
      description: "milestones.yaml references requirements.md at ../requirements.md — good traceability"
      suggestion: "Consider adding a requirements traceability matrix in the plan metadata."

    - id: INFO-002
      category: quality_gates
      description: "Quality gates are consistent across all milestones (go build, go test, go vet)"
      suggestion: "Consider adding staticcheck to the quality gates to match the existing Makefile lint target."

    - id: INFO-003
      category: best_practices
      description: "Plan wisely separates concerns: m0 (config), m1 (client), m2 (parsing), m3 (sync), m4 (testing)"
      suggestion: "The foundation-first ordering strategy is well-suited for a greenfield CLI tool."

    - id: INFO-004
      category: best_practices
      description: "m3 max_task_duration_minutes is 120 vs 90 for other milestones — appropriate for sync engine complexity"
      suggestion: "Good judgment. Sync engine tasks inherently involve more integration complexity."

    - id: INFO-005
      category: requirements_alignment
      description: "Requirements doc specifies 'Issue key collision: Update existing issue instead of creating' — covered by m4-002 TestError_KeyCollision"
      suggestion: "No action needed. Key collision edge case is now covered."

    - id: INFO-006
      category: best_practices
      description: "m1 and m2 can run in parallel after m0 — well-designed for minimal coupling"
      suggestion: "m1 creates jira/client.go, m2 creates jira/parser.go, jira/adf.go etc. Separate files, same package, no conflicts."

