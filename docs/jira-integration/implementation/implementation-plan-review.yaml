best_practices_review:
  task_sizing:
    compliant_count: 25
    total_count: 25
    compliance_percentage: 100
    violations: []

  style_anchors:
    coverage_score: 60
    tasks_with_anchors: 15
    tasks_without_anchors: 10
    missing_anchors:
      - task_id: m2-001-through-m2-007
        task_name: "M2 parsing tasks"
        reason: |
          M2 tasks can now reference m0 output files (jira/config.go, jira/discover.go) as
          style anchors since m0 completes before m2 starts. Current anchors reference m0
          output (jira/commands.go pattern) which is sufficient.

      - task_id: m4-001-through-m4-003
        task_name: "M4 test tasks"
        reason: |
          M4 tasks reference jira/integration_test.go as anchor (created by m3-008).
          Test-only tasks don't typically need code style anchors.

  tdd_requirements:
    test_first_compliance: 100
    tdd_flag_set: true
    violations: []

  drift_prevention:
    affirmative_instructions: 85
    ambiguous_tasks: []

