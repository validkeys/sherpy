    description: |
      Define Go structs for GlobalConfig, LocalConfig, and SyncState. Implement
      YAML loading and saving for all three. Handle missing files, invalid YAML,
      and path resolution.
    estimate_minutes: 60
    type: code
    dependencies: [m0-001]
    files:
      create:
        - jira/config.go
        - jira/config_test.go
    instructions: |
      **Objective:**
      Implement the config layer with types, loading, and saving.

      **Style Anchors:**
      - **cmd/root.go:82-105** — File I/O pattern (stat → read → error wrapping)

      **TDD Workflow:**
      1. Write failing test: TestGlobalConfigRoundTrip — save config to temp file, load it back, verify fields match
      2. Implement GlobalConfig type, SaveGlobalConfig, LoadGlobalConfig to pass
      3. Write failing test: TestLoadSyncStateMissing — verify missing file returns nil without error
      4. Implement LoadSyncState with the missing-file grace case to pass
      5. Write failing test: TestGlobalConfigPath — verify returns ~/.config/sherpy-to-jira/config.yaml
      6. Implement GlobalConfigPath to pass
      7. Write failing test: TestInvalidYAML — verify invalid YAML returns descriptive error
      8. Verify test passes (handled by yaml.Unmarshal)
      9. Write failing test: TestLocalConfigDefaultSyncState — verify SyncState defaults when empty
      10. Implement default in LoadLocalConfig to pass

      **Implementation Steps:**
      1. Create jira/config.go with the following types:

         GlobalConfig:
         - Jira.Domain string
         - Jira.IssueTypes struct { Epic, Story, SubTask string }

         LocalConfig:
         - ProjectKey string
         - ProjectName string
         - DeveloperSummary string
         - Milestones string
         - TasksDir string
         - Timeline string (optional)
         - SyncState string (default "sherpy-jira-sync-state.yaml")

         SyncState:
         - Version string
         - ProjectKey string
         - ProjectID string
         - LastSync string (ISO 8601)
         - Epic struct with JiraKey, JiraID, ContentHash
         - Milestones map[string]SyncEntry
         - Tasks map[string]SyncEntry
         - Links []LinkEntry

         SyncEntry: JiraKey, JiraID, ContentHash strings
         LinkEntry: Outward, Inward, Type strings

      2. Implement LoadGlobalConfig(path string) (*GlobalConfig, error)
      3. Implement SaveGlobalConfig(cfg *GlobalConfig, path string) error
      4. Implement LoadLocalConfig(path string) (*LocalConfig, error)
         — Set SyncState default if empty
      5. Implement SaveLocalConfig(cfg *LocalConfig, path string) error
      6. Implement LoadSyncState(path string) (*SyncState, error)
         — Return nil, nil if file doesn't exist (not an error)
      7. Implement SaveSyncState(state *SyncState, path string) error
      8. Implement GlobalConfigPath() string
         — Return ~/.config/sherpy-to-jira/config.yaml
         — Use os.UserHomeDir() + filepath.Join

      **Constraints:**
      - Use gopkg.in/yaml.v3 for marshaling/unmarshaling
      - All file saves must create parent directories (os.MkdirAll)
      - Config file permissions: 0600

      **Success Criteria:**
      - All config types round-trip through YAML correctly
      - GlobalConfigPath returns correct XDG path
      - Missing sync state handled gracefully
      - All tests pass

  - id: m0-003
    name: "Implement file discovery for init command"
    description: |
      Implement the convention-first file discovery algorithm. Search common
      sherpy directory patterns first, then fall back to recursive walk.
    estimate_minutes: 60
    type: code
    dependencies: [m0-002]
    files:
      create:
        - jira/discover.go
        - jira/discover_test.go
    instructions: |
      **Objective:**
      Implement file discovery that finds sherpy source documents in a directory.

      **TDD Workflow:**
      1. Write failing test: TestDiscoverFiles_ConventionFirst — create temp dir with
         docs/**/implementation/milestones.yaml structure, verify convention search finds it
      2. Implement Phase 1 convention search to pass
      3. Write failing test: TestDiscoverFiles_RecursiveFallback — create temp dir with
         flat files, verify recursive fallback finds them
      4. Implement Phase 2 recursive fallback to pass
      5. Write failing test: TestDiscoverFiles_MissingTimeline — verify timeline missing
         produces warning in result, not an error
      6. Add warning logic to pass
      7. Write failing test: TestDiscoverFiles_EmptyDirectory — verify empty dir returns error
      8. Verify test passes

      **Implementation Steps:**
      1. Define DiscoverResult struct:
         - DeveloperSummary string (path or "" if not found)
         - Milestones string (path)
         - TasksDir string (path to directory containing milestone-m*.tasks.yaml)
         - Timeline string (path or "" if not found)
         - Warnings []string (e.g., "timeline.yaml not found")

      2. Implement DiscoverFiles(root string) (*DiscoverResult, error):
         Phase 1 — Convention search:
         a. Walk root looking for directories containing milestones.yaml
            Common patterns: docs/**/implementation/milestones.yaml, docs/**/milestones.yaml
         b. For each milestones.yaml found, check sibling/child dirs for:
            - developer-summary.md (search parent/relative dirs)
            - tasks/ or implementation/tasks/ dir with milestone-m*.tasks.yaml files
            - timeline.yaml (search sibling dirs)
         c. Score each candidate and pick best match

         Phase 2 — Recursive fallback (if convention search fails):
         a. filepath.WalkDir from root
         b. Match exact filenames: milestones.yaml, developer-summary.md, timeline.yaml
         c. Match glob: milestone-m*.tasks.yaml (extract parent dir as tasks_dir)
         d. Pick closest matches by directory proximity

      3. Validate discovered files:
         - milestones.yaml must exist and be parseable
         - tasks_dir must contain at least one milestone-m*.tasks.yaml file
         - developer-summary.md is required
         - timeline.yaml is optional (add warning if missing)

      **Constraints:**
      - All returned paths must be relative to root
      - Never follow symlinks outside root
      - Skip .git, node_modules, vendor directories

      **Success Criteria:**
      - Discovers files in a real sherpy project (docs/plan/002-pm/ structure)
      - Convention search finds files faster than recursive walk
      - Missing timeline produces warning, not error
      - Empty directory returns clear error message

