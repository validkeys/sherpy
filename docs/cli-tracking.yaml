version: "1.0.0"
project: sherpy-cli
generated: "2026-05-13T10:00:00Z"

overview: |
  Build a Go CLI tool (`sherpy`) that validates Sherpy YAML documents
  against structured Go schemas and converts them to Markdown.

  Two commands: `validate` and `to-markdown`. Seven document types.
  Single static binary, no runtime dependencies.

meta:
  ordering_strategy: foundation-first
  ordering_rationale: "Build core infrastructure (CLI framework, YAML parsing, schema registry, error reporting) before adding document-specific schemas and markdown converters. This ensures each schema task is purely additive."

milestones:
  - id: m0
    name: Project Scaffold & CLI Framework
    description: |
      Initialize Go module, set up cobra CLI with root command,
      wire `validate`, `to-markdown`, and `types` subcommands.
      Create the schema registry that maps type names to Go structs.

      Deliverables:
      - go.mod with dependencies (cobra, yaml.v3, go-playground/validator)
      - cmd/ package with root, validate, to-markdown, types commands
      - schema/registry.go mapping type names → parse/validate functions
      - Basic error formatter (collect + print validation errors)
      - Working `sherpy types` command
    dependencies: []
    estimated_duration: "1 day"
    tasks_file: milestone-m0.tasks.yaml
    success_criteria:
      - "go build ./... succeeds"
      - "sherpy types lists all 7 document types"
      - "sherpy validate -t business-requirements -f nonexistent.yaml returns file-not-found error"
      - "CLI returns non-zero exit code on validation failure"

  - id: m1
    name: Business Requirements Schema
    description: |
      Implement the most complex schema first as the reference pattern
      for all subsequent schemas. Includes cross-field validation
      (use_case.actor must match a persona name, FR-IDs sequential).

      Deliverables:
      - schema/business_requirements.go with full struct + validation
      - Custom validators for: FR-ID pattern, sequential IDs, actor↔persona refs
      - Unit tests validating against example.yaml (pass) and mutated fixtures (fail)
    dependencies: [m0]
    estimated_duration: "1 day"
    tasks_file: milestone-m1.tasks.yaml
    success_criteria:
      - "sherpy validate -t business-requirements -f example.yaml passes"
      - "Missing required field produces clear error with field path"
      - "FR-ID pattern mismatch detected"
      - "Actor not matching any persona name detected"
      - "Warning emitted for <3 risks (default mode), error in --strict"

  - id: m2
    name: Remaining Document Schemas
    description: |
      Implement schemas for the other 6 document types, following the
      pattern established in m1. Each schema is independent.

      Deliverables:
      - schema/technical_requirements.go
      - schema/milestones.go (including dependency graph validation)
      - schema/milestone_tasks.go (including task ID sequencing)
      - schema/timeline.go (including workback date validation)
      - schema/qa_test_plan.go
      - schema/gap_analysis.go
      - Unit tests for each against example.yaml files
    dependencies: [m1]
    estimated_duration: "2 days"
    tasks_file: milestone-m2.tasks.yaml
    success_criteria:
      - "All 7 example.yaml files pass validation"
      - "Milestones schema detects circular dependencies"
      - "Milestone tasks schema detects non-sequential task IDs"
      - "Timeline schema validates workback date consistency"
      - "Each schema has ≥5 test cases covering error paths"

  - id: m3
    name: Markdown Conversion
    description: |
      Implement to-markdown command using Go text/template.
      Each document type gets a template that renders structured Markdown
      following the conversion strategies defined in each spec.md.

      Deliverables:
      - markdown/ package with template rendering engine
      - markdown/business_requirements.go (template + conversion logic)
      - markdown/technical_requirements.go
      - markdown/milestones.go
      - markdown/milestone_tasks.go
      - markdown/timeline.go
      - markdown/qa_test_plan.go
      - markdown/gap_analysis.go
      - Tests: YAML in → Markdown out, verify structure
    dependencies: [m2]
    estimated_duration: "2 days"
    tasks_file: milestone-m3.tasks.yaml
    success_criteria:
      - "sherpy to-markdown -t business-requirements -f example.yaml outputs valid Markdown"
      - "Output includes all required sections per spec conversion strategy"
      - "Tables rendered correctly (functional requirements, success criteria, risks)"
      - "-o flag writes to file instead of stdout"
      - "Each type has a golden-file test comparing output to expected Markdown"

  - id: m4
    name: Polish, Build & Distribution
    description: |
      Add CI build, goreleaser config, README with install instructions,
      and final integration tests.

      Deliverables:
      - .goreleaser.yml for multi-platform builds
      - Makefile with lint, test, build targets
      - Updated README.md with CLI usage
      - Integration test suite (validate all example.yaml files end-to-end)
      - go vet / staticcheck passes cleanly
    dependencies: [m3]
    estimated_duration: "1 day"
    tasks_file: milestone-m4.tasks.yaml
    success_criteria:
      - "make lint && make test && make build all pass"
      - "Binary works on macOS and Linux"
      - "README documents all commands with examples"
      - "All example.yaml files validate and convert cleanly"
