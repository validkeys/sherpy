milestone: m1
name: "Repository Cleanup"
description: "Remove accidentally committed sherpy binary from Git history"

style_anchors:
  primary:
    - path: "artifacts/style-anchors/git-remove-from-history"
      description: "Safe pattern for removing files from Git history"

global_constraints:
  - "CRITICAL: This rewrites Git history - coordinate with team"
  - "Force push will be required after history rewrite"
  - "Create backup branch before proceeding"
  - "Verify .gitignore before cleanup"

quality_gates:
  pre_commit:
    - "git status shows binary not tracked"
  post_cleanup:
    - "git log --all -- sherpy returns no results"
    - "ls -lh shows no sherpy binary"

tasks:
  - id: m1-001
    name: "Verify .gitignore configuration"
    description: |
      Confirm sherpy binary is properly ignored before removing from history
      to prevent accidental re-commit
    estimate_minutes: 10
    type: config
    dependencies: []
    files:
      create: []
      modify: []
      touch_only:
        - .gitignore
    instructions: |
      **Objective:**
      Verify .gitignore properly configured to prevent sherpy binary from
      being committed again after history cleanup.

      **Verification Steps:**
      1. Read .gitignore file
      2. Confirm entry exists: `sherpy` or `/sherpy`
      3. Test ignore is working:
         ```bash
         # Create dummy binary
         echo "test" > sherpy
         chmod +x sherpy

         # Verify it's ignored
         git status --ignored | grep sherpy

         # Clean up test
         rm sherpy
         ```
      4. If entry missing or incorrect, report issue

      **Expected .gitignore Content:**
      ```
      # Go binaries
      sherpy
      ```

      **Constraints:**
      - Do not modify .gitignore (already correct per review)
      - Only verify configuration
      - Report if ignore not working

      **Validation:**
      ```bash
      grep -q "^sherpy$" .gitignore || grep -q "^/sherpy$" .gitignore
      ```
      Expected: Entry found in .gitignore

      **Drift Policy:**
      If sherpy is not in .gitignore, STOP. Add it before proceeding with
      history cleanup.

    validation:
      commands:
        - grep -q "sherpy" .gitignore
      expected_output: "sherpy found in .gitignore"
      on_failure: "Add sherpy to .gitignore before proceeding"

  - id: m1-002
    name: "Create backup branch"
    description: |
      Create backup of current branch state before rewriting history,
      for safety and easy recovery if needed
    estimate_minutes: 5
    type: git
    dependencies: [m1-001]
    files:
      create: []
      modify: []
      touch_only: []
    instructions: |
      **Objective:**
      Create safety backup branch before rewriting Git history.

      **Implementation:**
      ```bash
      # Create backup branch from current state
      git branch backup/feat-sherpy-prompt-pre-cleanup

      # Verify backup created
      git branch --list backup/feat-sherpy-prompt-pre-cleanup

      # Show current commit
      git log -1 --oneline
      ```

      **Constraints:**
      - Branch name: backup/feat-sherpy-prompt-pre-cleanup
      - Do not push backup (local safety only)
      - Do not switch to backup branch

      **Validation:**
      ```bash
      git branch --list | grep -q "backup/feat-sherpy-prompt-pre-cleanup"
      ```
      Expected: Backup branch exists

      **Recovery Note:**
      If cleanup goes wrong, restore with:
      ```bash
      git reset --hard backup/feat-sherpy-prompt-pre-cleanup
      ```

    validation:
      commands:
        - git branch --list | grep -q "backup/feat-sherpy-prompt-pre-cleanup"
      expected_output: "Backup branch created"
      on_failure: "Manual intervention required"

  - id: m1-003
    name: "Remove binary from working directory"
    description: |
      Delete sherpy binary from working directory if present
    estimate_minutes: 5
    type: git
    dependencies: [m1-002]
    files:
      create: []
      modify: []
      touch_only: []
    instructions: |
      **Objective:**
      Remove sherpy binary from working directory to avoid confusion during
      history cleanup.

      **Implementation:**
      ```bash
      # Check if binary exists
      if [ -f sherpy ]; then
          echo "Removing sherpy binary from working directory"
          rm sherpy
      else
          echo "No sherpy binary in working directory"
      fi

      # Verify removed
      ls -la | grep sherpy || echo "sherpy not in directory (correct)"

      # Ensure not staged
      git status | grep sherpy && git rm --cached sherpy || echo "not staged"
      ```

      **Constraints:**
      - Only remove from working directory
      - Do not commit yet (history rewrite comes next)
      - Verify git status shows it ignored

      **Validation:**
      ```bash
      ! test -f sherpy
      ```
      Expected: Binary does not exist in working directory

    validation:
      commands:
        - '! test -f sherpy'
      expected_output: "Binary not in working directory"
      on_failure: "Manually remove sherpy file"

  - id: m1-004
    name: "Remove binary from Git history using filter-branch"
    description: |
      Rewrite Git history to completely remove sherpy binary using git filter-branch
    estimate_minutes: 15
    type: git
    dependencies: [m1-003]
    files:
      create: []
      modify: []
      touch_only: []
    style_anchor_refs:
      - "artifacts/style-anchors/git-remove-from-history"
    instructions: |
      **Objective:**
      Remove sherpy binary from all commits in Git history on this branch.

      **CRITICAL WARNING:**
      This rewrites Git history. Coordinate with team if others are working
      on this branch. Force push will be required.

      **Style Anchor:**
      Follow pattern in artifacts/style-anchors/git-remove-from-history

      **Implementation:**
      ```bash
      # Remove from all history
      git filter-branch --force --index-filter \
        'git rm --cached --ignore-unmatch sherpy' \
        --prune-empty --tag-name-filter cat -- --all

      # Clean up refs/original backup
      git for-each-ref --format="delete %(refname)" refs/original | \
        git update-ref --stdin

      # Expire reflog
      git reflog expire --expire=now --all

      # Garbage collect to reclaim space
      git gc --prune=now --aggressive
      ```

      **Alternative (if filter-branch fails):**
      If filter-branch is deprecated, use filter-repo:
      ```bash
      git filter-repo --path sherpy --invert-paths --force
      ```

      **Constraints:**
      - Run on feat/sherpy-prompt-command branch
      - Backup branch already created (m1-002)
      - Do not push yet (verify first)

      **Validation:**
      ```bash
      # Verify binary not in history
      git log --all --full-history -- sherpy | wc -l

      # Should be 0
      [ $(git log --all --full-history -- sherpy | wc -l) -eq 0 ]

      # Check repo size reduced
      du -sh .git
      ```
      Expected: No commits reference sherpy, .git directory smaller

      **Drift Policy:**
      If filter-branch fails with error, STOP and report the error.
      Do not attempt to force through - may need alternative approach.

      **Recovery:**
      If something goes wrong:
      ```bash
      git reset --hard backup/feat-sherpy-prompt-pre-cleanup
      ```

    validation:
      commands:
        - git log --all --full-history -- sherpy | wc -l | grep -q "^0$"
      expected_output: "Zero commits reference sherpy binary"
      on_failure: "History rewrite failed, restore from backup"

  - id: m1-005
    name: "Verify cleanup and document results"
    description: |
      Verify binary successfully removed and document cleanup results
    estimate_minutes: 10
    type: docs
    dependencies: [m1-004]
    files:
      create:
        - docs/pr9-remediation/artifacts/binary-cleanup-report.md
      modify: []
      touch_only: []
    instructions: |
      **Objective:**
      Verify cleanup successful and document results for review.

      **Verification Steps:**
      ```bash
      # 1. Verify no commits reference binary
      echo "Commits referencing sherpy:"
      git log --all --full-history -- sherpy | wc -l

      # 2. Verify binary not in working directory
      echo "Binary in working directory:"
      ls -la sherpy 2>&1 || echo "Not found (correct)"

      # 3. Verify git status clean
      echo "Git status:"
      git status

      # 4. Check repository size
      echo "Repository size:"
      du -sh .git

      # 5. Verify .gitignore still correct
      echo "Gitignore configuration:"
      grep sherpy .gitignore
      ```

      **Create Report:**
      Create docs/pr9-remediation/artifacts/binary-cleanup-report.md:

      ```markdown
      # Binary Cleanup Report - PR #9

      **Date:** 2026-05-14
      **Branch:** feat/sherpy-prompt-command
      **Binary:** sherpy (6.3MB)

      ## Cleanup Summary

      ✅ Binary removed from Git history
      ✅ Binary not in working directory
      ✅ .gitignore properly configured
      ✅ Repository size reduced

      ## Verification Results

      ### Git History Check
      ```
      $ git log --all --full-history -- sherpy | wc -l
      0
      ```
      **Result:** No commits reference the binary ✓

      ### Working Directory Check
      ```
      $ ls -la sherpy
      ls: sherpy: No such file or directory
      ```
      **Result:** Binary not present ✓

      ### Gitignore Check
      ```
      $ grep sherpy .gitignore
      sherpy
      ```
      **Result:** Properly ignored ✓

      ### Repository Size
      - Before: ~[X]MB
      - After: ~[Y]MB
      - Saved: ~6.3MB

      ## Next Steps

