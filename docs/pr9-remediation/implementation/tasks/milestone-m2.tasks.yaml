milestone: m2
name: "Documentation Updates"
description: "Update repository references, add CHANGELOG, document contributor workflow"

style_anchors:
  primary:
    - path: "artifacts/style-anchors/changelog-entry"
      description: "Standard CHANGELOG.md entry format"

global_constraints:
  - "Update ALL repository references consistently"
  - "Follow Keep a Changelog format for CHANGELOG.md"
  - "Contributor docs should be clear and actionable"

quality_gates:
  pre_commit:
    - "grep -r 'kydavis/sherpy' docs/ README.md && exit 1 || exit 0"
    - "test -f CHANGELOG.md"
    - "grep -q 'go:generate' CONTRIBUTING.md || CONTRIBUTING.md doesn't exist yet"

tasks:
  - id: m2-001
    name: "Find all kydavis/sherpy references"
    description: |
      Scan all documentation files to locate repository reference inconsistencies
    estimate_minutes: 15
    type: docs
    dependencies: []
    files:
      create:
        - docs/pr9-remediation/artifacts/repo-references-audit.txt
      modify: []
      touch_only: []
    instructions: |
      **Objective:**
      Audit all files for kydavis/sherpy references that need updating to
      validkeys/sherpy.

      **Implementation:**
      ```bash
      # Search all documentation files
      echo "Repository Reference Audit" > docs/pr9-remediation/artifacts/repo-references-audit.txt
      echo "Date: $(date)" >> docs/pr9-remediation/artifacts/repo-references-audit.txt
      echo "" >> docs/pr9-remediation/artifacts/repo-references-audit.txt

      echo "Files containing 'kydavis/sherpy':" >> docs/pr9-remediation/artifacts/repo-references-audit.txt
      grep -r "kydavis/sherpy" \
        --include="*.md" \
        --include="*.yaml" \
        --include="*.yml" \
        --include="*.sh" \
        . | tee -a docs/pr9-remediation/artifacts/repo-references-audit.txt

      echo "" >> docs/pr9-remediation/artifacts/repo-references-audit.txt
      echo "Expected updates:" >> docs/pr9-remediation/artifacts/repo-references-audit.txt
      echo "- README.md: go install line" >> docs/pr9-remediation/artifacts/repo-references-audit.txt
      echo "- Any other references found above" >> docs/pr9-remediation/artifacts/repo-references-audit.txt
      ```

      **Constraints:**
      - Search markdown, YAML, and shell script files
      - Document all findings
      - Include file paths and line numbers

      **Validation:**
      ```bash
      test -f docs/pr9-remediation/artifacts/repo-references-audit.txt
      grep -q "kydavis/sherpy" docs/pr9-remediation/artifacts/repo-references-audit.txt || echo "None found"
      ```
      Expected: Audit file created with findings

    validation:
      commands:
        - test -f docs/pr9-remediation/artifacts/repo-references-audit.txt
      expected_output: "Audit file created"
      on_failure: "Create audit file manually"

  - id: m2-002
    name: "Update README.md repository references"
    description: |
      Replace kydavis/sherpy with validkeys/sherpy in README.md
    estimate_minutes: 15
    type: docs
    dependencies: [m2-001]
    files:
      create: []
      modify:
        - README.md
      touch_only: []
    instructions: |
      **Objective:**
      Update repository references in README.md from kydavis/sherpy to
      validkeys/sherpy for consistency.

      **Implementation Steps:**
      1. Read README.md
      2. Find all occurrences of kydavis/sherpy
      3. Replace with validkeys/sherpy
      4. Verify links still work (if any GitHub links)

      **Expected Change:**
      Code review identified line 66:
      ```diff
      -go install github.com/kydavis/sherpy@latest
      +go install github.com/validkeys/sherpy@latest
      ```

      Also check for other occurrences in:
      - Clone URLs
      - Go import paths
      - Documentation links

      **Constraints:**
      - ONLY modify README.md
      - Replace all instances consistently
      - Maintain existing formatting
      - Verify no broken links introduced

      **Validation:**
      ```bash
      # Verify no kydavis references remain
      ! grep -q "kydavis/sherpy" README.md

      # Verify validkeys references exist
      grep -q "validkeys/sherpy" README.md

      # Count replacements made
      grep -c "validkeys/sherpy" README.md
      ```
      Expected: No kydavis references, validkeys references present

      **Drift Policy:**
      If README.md structure has changed significantly from review, STOP
      and report differences.

    validation:
      commands:
        - '! grep -q "kydavis/sherpy" README.md'
        - grep -q "validkeys/sherpy" README.md
      expected_output: "All references updated"
      on_failure: "Review README.md for missed references"

  - id: m2-003
    name: "Update other documentation files"
    description: |
      Update repository references in any other documentation files found
      in audit (USAGE.md, install.sh, etc.)
    estimate_minutes: 20
    type: docs
    dependencies: [m2-001]
    files:
      create: []
      modify:
        - USAGE.md
        - install.sh
        - uninstall.sh
      touch_only: []
    instructions: |
      **Objective:**
      Update repository references in all other documentation files
      identified in the audit.

      **Implementation:**
      Based on audit findings, update:
      1. USAGE.md - any repository references
      2. install.sh - clone URL or go install references
      3. uninstall.sh - any references (if present)
      4. Any other files found in audit

      **Replace Pattern:**
      ```bash
      # For each file found in audit:
      sed -i 's|kydavis/sherpy|validkeys/sherpy|g' [filename]
      ```

      **Files to Check:**
      - USAGE.md
      - install.sh
      - uninstall.sh
      - skills/*/SKILL.md (if any reference the repo)
      - docs/**/*.md

      **Constraints:**
      - Only modify files that actually contain kydavis/sherpy
      - Use consistent replacement across all files
      - Maintain file formatting and structure

      **Validation:**
      ```bash
      # Verify no kydavis references remain in common docs
      ! grep -r "kydavis/sherpy" README.md USAGE.md install.sh uninstall.sh 2>/dev/null

      # Verify validkeys references present
      grep -r "validkeys/sherpy" README.md USAGE.md install.sh 2>/dev/null | wc -l
      ```
      Expected: No kydavis references remain, validkeys references present

    validation:
      commands:
        - '! grep -r "kydavis/sherpy" README.md USAGE.md install.sh 2>/dev/null'
        - grep -qr "validkeys/sherpy" README.md
      expected_output: "All repository references updated"
      on_failure: "Check for additional files with references"

  - id: m2-004
    name: "Create CHANGELOG.md"
    description: |
      Create CHANGELOG.md with entry for sherpy prompt command feature
    estimate_minutes: 30
    type: docs
    dependencies: []
    files:
      create:
        - CHANGELOG.md
      modify: []
      touch_only: []
    style_anchor_refs:
      - "artifacts/style-anchors/changelog-entry"
    instructions: |
      **Objective:**
      Create CHANGELOG.md following Keep a Changelog format with entry
      documenting the new sherpy prompt command.

      **Style Anchor:**
      Follow format in artifacts/style-anchors/changelog-entry

      **File Content:**
      ```markdown
      # Changelog

      All notable changes to this project will be documented in this file.

      The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
      and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

      ## [Unreleased]

      ### Added
      - New `sherpy prompt` command for outputting skill instructions to stdout
      - `sherpy prompt --list` flag to list all available prompts
      - `sherpy prompt -t <type>` flag to output specific prompt content
      - Embedded prompt content in binary via go:generate (12 pipeline skills)
      - New skill: `sherpy-cli-planner` for orchestrating planning workflow via CLI
      - Token-efficient planning workflow: 80K tokens vs 720K (90% reduction)
      - Integration tests for prompt command functionality
      - Comprehensive test suite for frontmatter stripping
      - Build-time filtering of non-pipeline skills

      ### Changed
      - Updated Makefile with `generate` target for go:generate workflow
      - Updated README.md with prompt command usage examples
      - Updated USAGE.md with token efficiency rationale and calculation
      - Extracted `stripFrontmatter` to shared utility in `prompt/frontmatter.go`
      - Improved test output by filtering orphaned prompt warnings

      ### Fixed
      - Removed accidentally committed sherpy binary from repository (6.3MB)
      - Eliminated code duplication in prompt package
      - Fixed orphaned prompt warnings in test output
      - Updated repository references from kydavis/sherpy to validkeys/sherpy

      ### Technical Details
      - **Prompt Registry:** 12 pipeline step prompts (gap-analysis through executive-summary)
      - **Build Process:** go:generate embeds skills at build time
      - **Security:** Frontmatter stripped at build time (not runtime)
      - **Testing:** 18 new tests across unit and integration layers

      ## [0.1.0] - 2025-XX-XX (Previous Release)

      ### Added
      - Initial release with validate, to-markdown, and types commands
      - Schema validation for 7 document types
      - Markdown conversion functionality
      - Integration tests for CLI commands

      [Unreleased]: https://github.com/validkeys/sherpy/compare/v0.1.0...HEAD
      [0.1.0]: https://github.com/validkeys/sherpy/releases/tag/v0.1.0
      ```

      **Constraints:**
      - ONLY create CHANGELOG.md
      - Follow Keep a Changelog format
      - Include all PR #9 changes
      - Document code review remediation fixes
      - Use validkeys/sherpy in links

      **Validation:**
      ```bash
      test -f CHANGELOG.md
      grep -q "sherpy prompt" CHANGELOG.md
      grep -q "validkeys/sherpy" CHANGELOG.md
      ! grep -q "kydavis/sherpy" CHANGELOG.md
      ```
      Expected: CHANGELOG created with all changes documented

    validation:
      commands:
        - test -f CHANGELOG.md
        - grep -q "sherpy prompt" CHANGELOG.md
        - '! grep -q "kydavis/sherpy" CHANGELOG.md'
      expected_output: "CHANGELOG.md created with correct content"
      on_failure: "Review CHANGELOG.md format and content"

  - id: m2-005
    name: "Create or update CONTRIBUTING.md"
    description: |
      Add section to CONTRIBUTING.md documenting the go:generate workflow
      for updating embedded skill content
    estimate_minutes: 30
    type: docs
    dependencies: []
    files:
      create:
        - CONTRIBUTING.md
      modify: []
      touch_only: []
    instructions: |
      **Objective:**
      Document the go:generate workflow for contributors who modify skill files.

      **Check if CONTRIBUTING.md Exists:**
      ```bash
      if [ -f CONTRIBUTING.md ]; then
          echo "CONTRIBUTING.md exists - will update"
      else
          echo "CONTRIBUTING.md does not exist - will create"
      fi
      ```

      **File Content (if creating new):**
      ```markdown
      # Contributing to Sherpy

      Thank you for contributing to Sherpy! This document provides guidelines
      for contributing to the project.

      ## Development Setup

      ### Prerequisites

      - Go 1.26 or later
      - Make
      - Git

      ### Clone and Build

      ```bash
      git clone https://github.com/validkeys/sherpy.git
      cd sherpy
      make build
      ```

      ### Running Tests

      ```bash
      make test
      ```

      ## Working with Skills

      The `sherpy prompt` command embeds skill content in the binary at build time.
      If you modify any skill files, you must regenerate the embedded content.

      ### Updating Skill Files

      When modifying files in `skills/*/SKILL.md`:

      1. **Make your changes** to the skill file
      2. **Regenerate embedded content:**
         ```bash
         make generate
         ```
         This runs `go generate ./prompt/...` which executes `gen_prompts.go`
      3. **Verify generation worked:**
         ```bash
         git diff prompt/content_generated.go
         ```
         You should see your changes reflected in the generated file
      4. **Run tests:**
         ```bash
         make test
         ```
      5. **Commit both files:**
         ```bash
         git add skills/your-skill/SKILL.md
         git add prompt/content_generated.go
         git commit -m "feat: update your-skill instructions"
         ```

      ### What Gets Embedded

      Only **pipeline skill** content is embedded in the binary:
      - gap-analysis-worksheet
      - business-requirements-interview
      - technical-requirements-interview
      - style-anchors-collection
      - implementation-planner
      - implementation-plan-review
      - definition-of-done
      - architecture-decision-record
      - delivery-timeline
      - qa-test-plan
      - developer-summary
      - executive-summary

      **Orchestrator skills** (sherpy-cli-planner, sherpy-flow, etc.) are NOT
      embedded as they reference pipeline skills rather than being pipeline steps.

      ### Build Process Details

      - `prompt/gen_prompts.go` - Build-time script that reads skills
      - `prompt/content_generated.go` - Generated file with embedded content
      - Frontmatter (---\nname: ...\n---) is stripped during generation
      - Content is embedded using Go's map[string]string

      ## Pull Request Guidelines

      1. **One feature per PR** - Keep changes focused
      2. **Write tests** - All new code should have tests
      3. **Update docs** - Keep README and CHANGELOG current
      4. **Run quality checks:**
         ```bash
         make test
         go vet ./...
         go fmt ./...
         ```
      5. **Commit message format:**
         ```
         type(scope): description

         Types: feat, fix, docs, refactor, test, chore
         Example: feat(prompt): add new pipeline step
         ```

      ## Code Review Process

      - All PRs require approval from maintainer
      - CI must pass (tests, linting, generation check)
      - Code coverage should not decrease
      - Breaking changes require major version bump

      ## Questions?

      - Open an issue for bugs or feature requests
      - Check existing issues before creating new ones
      - Tag @maintainers for urgent questions
      ```

      **If CONTRIBUTING.md Already Exists:**
      Add the "Working with Skills" section after "Development Setup"

      **Constraints:**
      - Create new file or update existing
      - Document make generate workflow clearly
      - Explain which skills are embedded
      - Include troubleshooting tips
      - Use validkeys/sherpy in all references

      **Validation:**
      ```bash
      test -f CONTRIBUTING.md
      grep -q "make generate" CONTRIBUTING.md
      grep -q "go:generate" CONTRIBUTING.md
      grep -q "content_generated.go" CONTRIBUTING.md
      ```
      Expected: CONTRIBUTING.md exists with go:generate workflow documented

    validation:
      commands:
        - test -f CONTRIBUTING.md
        - grep -q "make generate" CONTRIBUTING.md
      expected_output: "CONTRIBUTING.md created/updated with workflow"
      on_failure: "Review CONTRIBUTING.md content"

  - id: m2-006
    name: "Comprehensive code review for m2"
    description: |
      Review all documentation updates for accuracy, completeness, and
      consistency
    estimate_minutes: 20
    type: code-review
    dependencies: [m2-002, m2-003, m2-004, m2-005]
    files:
      create:
        - docs/pr9-remediation/code-reviews/2026-05-14-3-code-review.yaml
      modify: []
      touch_only:
        - README.md
        - USAGE.md
        - CHANGELOG.md
        - CONTRIBUTING.md
        - install.sh
    instructions: |
      **Objective:**
      Review all documentation updates to ensure accuracy, consistency,
      and completeness against requirements FR-4, FR-5, FR-6.

      **Review Checklist:**
      1. **Repository References (FR-4):**
         - [ ] All docs use validkeys/sherpy
         - [ ] No kydavis/sherpy references remain
         - [ ] Links are functional

      2. **CHANGELOG (FR-5):**
         - [ ] CHANGELOG.md created
         - [ ] Follows Keep a Changelog format
         - [ ] Documents all PR #9 changes
         - [ ] Includes remediation fixes

      3. **Contributor Workflow (FR-6):**
         - [ ] CONTRIBUTING.md exists
         - [ ] go:generate workflow documented
         - [ ] Steps are clear and actionable
         - [ ] Examples provided

      4. **Documentation Quality:**
         - [ ] No broken links
         - [ ] Consistent formatting
         - [ ] Accurate technical details

      **Review Process:**
      ```bash
      # Check repository references
      echo "Checking for kydavis references:"
      grep -r "kydavis/sherpy" README.md USAGE.md CHANGELOG.md CONTRIBUTING.md install.sh || echo "None found (correct)"

      echo "Checking for validkeys references:"
      grep -r "validkeys/sherpy" README.md CHANGELOG.md CONTRIBUTING.md

      # Verify files exist
      for file in CHANGELOG.md CONTRIBUTING.md README.md; do
          test -f $file && echo "$file exists" || echo "$file MISSING"
      done

      # Check CHANGELOG format
      grep -q "## \[Unreleased\]" CHANGELOG.md && echo "CHANGELOG format correct"
      ```

      **Output Format:**
      Create docs/pr9-remediation/code-reviews/2026-05-14-3-code-review.yaml:

      ```yaml
      milestone: m2
      milestone_name: "Documentation Updates"
      review_date: "2026-05-14"
      reviewer: "claude-sonnet-4.5"

      summary:
        files_reviewed: 5
        issues_found: 0
        critical_issues: 0
        overall_quality: "excellent"

      verification:
        - item: "Repository references updated (FR-4)"
          status: "pass"
          evidence: "No kydavis/sherpy references remain, all use validkeys/sherpy"

        - item: "CHANGELOG.md created (FR-5)"
          status: "pass"
          evidence: "CHANGELOG exists, follows Keep a Changelog format"

        - item: "Contributor workflow documented (FR-6)"
          status: "pass"
          evidence: "CONTRIBUTING.md documents go:generate workflow"

        - item: "Documentation consistency"
          status: "pass"
          evidence: "All docs use consistent repository references"

      strengths:
        - "Comprehensive CHANGELOG with all changes"
        - "Clear contributor workflow documentation"
        - "Consistent repository references throughout"

      issues: []

      sign_off:
        ready_for_next_milestone: "yes"
        blocking_issues: []
        notes: |
          FR-4, FR-5, and FR-6 fully addressed. Documentation is accurate,
          complete, and consistent. Ready for security review milestone.
      ```

      **Constraints:**
      - Verify against FR-4, FR-5, FR-6
      - Check all documentation files
      - Ensure no broken links

      **Validation:**
      ```bash
      ! grep -r "kydavis/sherpy" README.md CHANGELOG.md CONTRIBUTING.md
      test -f docs/pr9-remediation/code-reviews/2026-05-14-3-code-review.yaml
      ```
      Expected: No old references, review complete

    validation:
      commands:
        - '! grep -r "kydavis/sherpy" README.md CHANGELOG.md 2>/dev/null'
        - test -f docs/pr9-remediation/code-reviews/2026-05-14-3-code-review.yaml
      expected_output: "Documentation consistent, review complete"
      on_failure: "Address issues before proceeding"
