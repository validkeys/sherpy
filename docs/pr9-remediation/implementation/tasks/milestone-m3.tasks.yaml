      **Implementation:**
      1. Read README.md
      2. Add new "Security" section before or after "Usage" section
      3. Document path validation policy clearly

      **Content to Add:**
      ```markdown
      ## Security

      ### Path Validation

      Sherpy validates file paths to prevent directory traversal attacks while
      allowing legitimate access to project files.

      **Path Policy:**
      - ✓ **Allowed:** Current directory and subdirectories
      - ✓ **Allowed:** One level of parent directory traversal (`../docs`)
      - ✗ **Blocked:** Two or more levels of parent traversal (`../../etc`)
      - ✓ **Enforced:** File size limit of 10MB

      **Example:**
      ```bash
      # Allowed paths
      sherpy validate -f ./requirements.yaml
      sherpy validate -f docs/business-requirements.yaml
      sherpy validate -f ../docs/requirements.yaml

      # Blocked paths
      sherpy validate -f ../../etc/passwd  # Error: path traversal detected
      ```

      **Rationale:**

      The one-level traversal allowance enables legitimate use cases like:
      - Accessing sibling directories in multi-project workspaces
      - Running sherpy from a different directory than your documents
      - Shared tooling in monorepos

      Since sherpy only **reads** files (no writes or execution) and respects
      your filesystem permissions, the security risk is limited to reading files
      you already have access to.

      **Additional Protections:**
      - Files are read with a 10MB size limit (prevents DoS)
      - Paths are normalized using `filepath.Clean`
      - Absolute path validation prevents bypass attempts
      - Your OS filesystem permissions still apply

      ### Reporting Security Issues

      If you discover a security vulnerability, please email security@validkeys.com
      instead of opening a public issue.
      ```

      **Placement:**
      Insert after "Quick Start" section or create new section before "Contributing"

      **Constraints:**
