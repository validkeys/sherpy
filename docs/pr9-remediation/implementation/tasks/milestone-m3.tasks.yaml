      1. One level traversal (should pass)
      2. Two level traversal (should block)
      3. Three+ level traversal (should block)

      ## Test Implementation Suggestions

      ```go
      func TestValidatePathTraversal(t *testing.T) {
          tests := []struct {
              name    string
              path    string
              wantErr bool
              reason  string
          }{
              {
                  name:    "current directory",
                  path:    "./file.yaml",
                  wantErr: false,
                  reason:  "current directory always allowed",
              },
              {
                  name:    "subdirectory",
                  path:    "subdir/file.yaml",
                  wantErr: false,
                  reason:  "subdirectories always allowed",
              },
              {
                  name:    "one level parent (allowed)",
                  path:    "../docs/file.yaml",
                  wantErr: false,
                  reason:  "one level up allowed for sibling access",
              },
              {
                  name:    "two levels parent (blocked)",
                  path:    "../../etc/passwd",
                  wantErr: true,
                  reason:  "two levels blocked for security",
              },
              {
                  name:    "three levels parent (blocked)",
                  path:    "../../../etc/passwd",
                  wantErr: true,
                  reason:  "three+ levels blocked",
              },
          }

          for _, tt := range tests {
              t.Run(tt.name, func(t *testing.T) {
                  err := validatePath(tt.path)
                  if (err != nil) != tt.wantErr {
                      t.Errorf("validatePath(%q) error = %v, wantErr %v - %s",
                          tt.path, err, tt.wantErr, tt.reason)
                  }
              })
          }
      }
      ```
