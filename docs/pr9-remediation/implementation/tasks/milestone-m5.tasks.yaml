milestone: m5
name: "Final Validation & Review"
description: "Comprehensive validation of all remediation work and preparation for re-review"

style_anchors:
  primary: []

global_constraints:
  - "Verify all FR and NFR requirements met"
  - "Ensure all tests pass cleanly"
  - "Confirm no regressions introduced"

quality_gates:
  all:
    - "All FR requirements verified complete"
    - "All NFR requirements verified met"
    - "Test suite passes with zero warnings"
    - "Binary not in Git history"
    - "Documentation accurate and complete"

tasks:
  - id: m5-001
    name: "Verify all functional requirements (FR)"
    description: |
      Systematically verify each FR from business requirements is
      fully addressed
    estimate_minutes: 20
    type: code-review
    dependencies: []
    files:
      create:
        - docs/pr9-remediation/artifacts/fr-verification-checklist.md
      modify: []
      touch_only: []
    instructions: |
      **Objective:**
      Verify each functional requirement from business-requirements.yaml
      is fully addressed by the implementation.

      **Requirements to Verify:**

      **FR-1: Remove Committed Binary**
      - [ ] Binary removed from Git history
      - [ ] `git log --all -- sherpy` returns no results
      - [ ] .gitignore properly configured
      - [ ] Repository size reduced

      **FR-2: Fix Orphaned Prompts Warning**
      - [ ] No warnings in test output
      - [ ] gen_prompts.go filters non-pipeline skills
      - [ ] Tests pass cleanly

      **FR-3: Deduplicate stripFrontmatter**
      - [ ] Single implementation in frontmatter.go
      - [ ] Both consumers use shared function
      - [ ] Tests verify behavior
      - [ ] No code duplication

      **FR-4: Update Repository References**
      - [ ] All docs reference validkeys/sherpy
      - [ ] No kydavis/sherpy references remain
      - [ ] Links functional

      **FR-5: Add CHANGELOG Entry**
      - [ ] CHANGELOG.md created/updated
      - [ ] Prompt command documented
      - [ ] Remediation fixes documented

      **FR-6: Document go:generate Workflow**
      - [ ] CONTRIBUTING.md includes workflow
      - [ ] Steps clear and actionable
      - [ ] Examples provided

      **FR-7: Add CI Check**
      - [ ] .github/workflows/validate-generated.yml created
      - [ ] CI checks for stale content
      - [ ] Clear error messages

      **FR-8: Review Path Traversal Policy**
      - [ ] Security policy documented
      - [ ] Rationale explained
      - [ ] Tests validate behavior
      - [ ] Alternatives evaluated

      **Verification Process:**
      ```bash
      echo "# Functional Requirements Verification" > docs/pr9-remediation/artifacts/fr-verification-checklist.md
      echo "Date: $(date)" >> docs/pr9-remediation/artifacts/fr-verification-checklist.md
      echo "" >> docs/pr9-remediation/artifacts/fr-verification-checklist.md

      # FR-1: Binary removal
      echo "## FR-1: Remove Committed Binary" >> docs/pr9-remediation/artifacts/fr-verification-checklist.md
      if [ $(git log --all --full-history -- sherpy | wc -l) -eq 0 ]; then
          echo "✅ Binary removed from Git history" >> docs/pr9-remediation/artifacts/fr-verification-checklist.md
      else
          echo "❌ Binary still in Git history" >> docs/pr9-remediation/artifacts/fr-verification-checklist.md
      fi
      grep -q "sherpy" .gitignore && echo "✅ .gitignore configured" >> docs/pr9-remediation/artifacts/fr-verification-checklist.md || echo "❌ .gitignore missing entry" >> docs/pr9-remediation/artifacts/fr-verification-checklist.md
      echo "" >> docs/pr9-remediation/artifacts/fr-verification-checklist.md

      # FR-2: Orphaned warnings
      echo "## FR-2: Fix Orphaned Prompts Warning" >> docs/pr9-remediation/artifacts/fr-verification-checklist.md
      if go test ./prompt/... -v 2>&1 | grep -i "orphaned"; then
          echo "❌ Orphaned warnings still present" >> docs/pr9-remediation/artifacts/fr-verification-checklist.md
      else
          echo "✅ No orphaned warnings in test output" >> docs/pr9-remediation/artifacts/fr-verification-checklist.md
      fi
      echo "" >> docs/pr9-remediation/artifacts/fr-verification-checklist.md

      # FR-3: Deduplication
      echo "## FR-3: Deduplicate stripFrontmatter" >> docs/pr9-remediation/artifacts/fr-verification-checklist.md
      test -f prompt/frontmatter.go && echo "✅ Shared frontmatter.go exists" >> docs/pr9-remediation/artifacts/fr-verification-checklist.md || echo "❌ frontmatter.go missing" >> docs/pr9-remediation/artifacts/fr-verification-checklist.md
      if [ $(grep -c "^func stripFrontmatter" prompt/*.go) -eq 0 ]; then
          echo "✅ No duplicate stripFrontmatter functions" >> docs/pr9-remediation/artifacts/fr-verification-checklist.md
      else
          echo "❌ Duplicate functions found" >> docs/pr9-remediation/artifacts/fr-verification-checklist.md
      fi
      echo "" >> docs/pr9-remediation/artifacts/fr-verification-checklist.md

      # FR-4: Repository references
      echo "## FR-4: Update Repository References" >> docs/pr9-remediation/artifacts/fr-verification-checklist.md
      if grep -r "kydavis/sherpy" README.md CHANGELOG.md CONTRIBUTING.md 2>/dev/null; then
          echo "❌ Old repository references found" >> docs/pr9-remediation/artifacts/fr-verification-checklist.md
      else
          echo "✅ All references updated to validkeys/sherpy" >> docs/pr9-remediation/artifacts/fr-verification-checklist.md
      fi
      echo "" >> docs/pr9-remediation/artifacts/fr-verification-checklist.md

      # FR-5: CHANGELOG
      echo "## FR-5: Add CHANGELOG Entry" >> docs/pr9-remediation/artifacts/fr-verification-checklist.md
      test -f CHANGELOG.md && echo "✅ CHANGELOG.md exists" >> docs/pr9-remediation/artifacts/fr-verification-checklist.md || echo "❌ CHANGELOG.md missing" >> docs/pr9-remediation/artifacts/fr-verification-checklist.md
      grep -q "sherpy prompt" CHANGELOG.md 2>/dev/null && echo "✅ Prompt command documented" >> docs/pr9-remediation/artifacts/fr-verification-checklist.md || echo "❌ Prompt command not in CHANGELOG" >> docs/pr9-remediation/artifacts/fr-verification-checklist.md
      echo "" >> docs/pr9-remediation/artifacts/fr-verification-checklist.md

      # FR-6: Contributor docs
      echo "## FR-6: Document go:generate Workflow" >> docs/pr9-remediation/artifacts/fr-verification-checklist.md
      test -f CONTRIBUTING.md && echo "✅ CONTRIBUTING.md exists" >> docs/pr9-remediation/artifacts/fr-verification-checklist.md || echo "❌ CONTRIBUTING.md missing" >> docs/pr9-remediation/artifacts/fr-verification-checklist.md
      grep -q "make generate" CONTRIBUTING.md 2>/dev/null && echo "✅ Workflow documented" >> docs/pr9-remediation/artifacts/fr-verification-checklist.md || echo "❌ Workflow not documented" >> docs/pr9-remediation/artifacts/fr-verification-checklist.md
      echo "" >> docs/pr9-remediation/artifacts/fr-verification-checklist.md

      # FR-7: CI check
      echo "## FR-7: Add CI Check" >> docs/pr9-remediation/artifacts/fr-verification-checklist.md
      test -f .github/workflows/validate-generated.yml && echo "✅ CI workflow exists" >> docs/pr9-remediation/artifacts/fr-verification-checklist.md || echo "❌ CI workflow missing" >> docs/pr9-remediation/artifacts/fr-verification-checklist.md
      echo "" >> docs/pr9-remediation/artifacts/fr-verification-checklist.md

      # FR-8: Security review
      echo "## FR-8: Review Path Traversal Policy" >> docs/pr9-remediation/artifacts/fr-verification-checklist.md
      grep -q "validatePath checks for path traversal" cmd/root.go && echo "✅ Security policy documented" >> docs/pr9-remediation/artifacts/fr-verification-checklist.md || echo "❌ Security policy not documented" >> docs/pr9-remediation/artifacts/fr-verification-checklist.md
      test -f docs/pr9-remediation/artifacts/security-analysis.md && echo "✅ Security analysis complete" >> docs/pr9-remediation/artifacts/fr-verification-checklist.md || echo "❌ Security analysis missing" >> docs/pr9-remediation/artifacts/fr-verification-checklist.md
      echo "" >> docs/pr9-remediation/artifacts/fr-verification-checklist.md

      # Summary
      echo "## Summary" >> docs/pr9-remediation/artifacts/fr-verification-checklist.md
      echo "Verification completed: $(date)" >> docs/pr9-remediation/artifacts/fr-verification-checklist.md
      echo "Review checklist above for any ❌ items that need attention." >> docs/pr9-remediation/artifacts/fr-verification-checklist.md
      ```

      **Constraints:**
      - Test each requirement independently
      - Document pass/fail clearly
      - Provide evidence for each check

      **Validation:**
      ```bash
      test -f docs/pr9-remediation/artifacts/fr-verification-checklist.md
      grep -c "✅" docs/pr9-remediation/artifacts/fr-verification-checklist.md
      ```
      Expected: Checklist created, all requirements pass

    validation:
      commands:
        - test -f docs/pr9-remediation/artifacts/fr-verification-checklist.md
      expected_output: "FR verification complete"
      on_failure: "Address failing requirements"

  - id: m5-002
    name: "Verify all non-functional requirements (NFR)"
    description: |
      Verify NFRs for security, maintainability, quality, and documentation
    estimate_minutes: 15
    type: code-review
    dependencies: []
    files:
      create:
        - docs/pr9-remediation/artifacts/nfr-verification-checklist.md
      modify: []
      touch_only: []
    instructions: |
      **Objective:**
      Verify each non-functional requirement is met.

      **NFR-1: Security**
      - [ ] Path traversal scenarios tested
      - [ ] Security rationale documented
      - [ ] Alternative approaches evaluated

      **NFR-2: Maintainability**
      - [ ] No code duplication
      - [ ] DRY principles followed
      - [ ] Shared utilities organized

      **NFR-3: Quality**
      - [ ] Clean test output
      - [ ] No warnings or clutter
      - [ ] Output is readable

      **NFR-4: Documentation**
      - [ ] Complete and accurate
      - [ ] Repository references consistent
      - [ ] Contributor workflow documented

      **Verification:**
      ```bash
      echo "# Non-Functional Requirements Verification" > docs/pr9-remediation/artifacts/nfr-verification-checklist.md
      echo "" >> docs/pr9-remediation/artifacts/nfr-verification-checklist.md

      # NFR-1: Security
      echo "## NFR-1: Security" >> docs/pr9-remediation/artifacts/nfr-verification-checklist.md
      grep -q "TestValidatePath" cmd/root_test.go && echo "✅ Path traversal tests exist" >> docs/pr9-remediation/artifacts/nfr-verification-checklist.md || echo "⚠️  Path traversal tests need review" >> docs/pr9-remediation/artifacts/nfr-verification-checklist.md
      grep -q "validatePath checks" cmd/root.go && echo "✅ Security documented" >> docs/pr9-remediation/artifacts/nfr-verification-checklist.md
      echo "" >> docs/pr9-remediation/artifacts/nfr-verification-checklist.md

      # NFR-2: Maintainability
      echo "## NFR-2: Maintainability" >> docs/pr9-remediation/artifacts/nfr-verification-checklist.md
      if [ $(grep -c "func stripFrontmatter" prompt/*.go) -eq 0 ]; then
          echo "✅ No code duplication (stripFrontmatter)" >> docs/pr9-remediation/artifacts/nfr-verification-checklist.md
      else
          echo "❌ Code duplication found" >> docs/pr9-remediation/artifacts/nfr-verification-checklist.md
      fi
      echo "" >> docs/pr9-remediation/artifacts/nfr-verification-checklist.md

      # NFR-3: Quality
      echo "## NFR-3: Quality" >> docs/pr9-remediation/artifacts/nfr-verification-checklist.md
      if go test ./... -v 2>&1 | grep -i "warning"; then
          echo "❌ Warnings in test output" >> docs/pr9-remediation/artifacts/nfr-verification-checklist.md
      else
          echo "✅ Clean test output, no warnings" >> docs/pr9-remediation/artifacts/nfr-verification-checklist.md
      fi
      echo "" >> docs/pr9-remediation/artifacts/nfr-verification-checklist.md

      # NFR-4: Documentation
      echo "## NFR-4: Documentation" >> docs/pr9-remediation/artifacts/nfr-verification-checklist.md
      for file in README.md CHANGELOG.md CONTRIBUTING.md; do
          test -f $file && echo "✅ $file exists" >> docs/pr9-remediation/artifacts/nfr-verification-checklist.md || echo "❌ $file missing" >> docs/pr9-remediation/artifacts/nfr-verification-checklist.md
      done
      echo "" >> docs/pr9-remediation/artifacts/nfr-verification-checklist.md

      echo "## Summary" >> docs/pr9-remediation/artifacts/nfr-verification-checklist.md
      echo "All NFRs verified: $(date)" >> docs/pr9-remediation/artifacts/nfr-verification-checklist.md
      ```

      **Validation:**
      ```bash
      test -f docs/pr9-remediation/artifacts/nfr-verification-checklist.md
      ```
      Expected: NFR verification complete

    validation:
      commands:
        - test -f docs/pr9-remediation/artifacts/nfr-verification-checklist.md
      expected_output: "NFR verification complete"
      on_failure: "Address failing NFRs"

  - id: m5-003
    name: "Run full test suite"
    description: |
      Run comprehensive test suite to ensure no regressions
    estimate_minutes: 10
    type: test
    dependencies: []
    files:
      create:
        - docs/pr9-remediation/artifacts/final-test-results.txt
      modify: []
      touch_only: []
    instructions: |
      **Objective:**
      Run full test suite and verify all tests pass cleanly with no warnings.

      **Test Commands:**
      ```bash
      echo "Final Test Suite Results" > docs/pr9-remediation/artifacts/final-test-results.txt
      echo "Date: $(date)" >> docs/pr9-remediation/artifacts/final-test-results.txt
      echo "" >> docs/pr9-remediation/artifacts/final-test-results.txt

      # Run all tests
      echo "Running full test suite..." >> docs/pr9-remediation/artifacts/final-test-results.txt
      if go test ./... -v -count=1 2>&1 | tee -a docs/pr9-remediation/artifacts/final-test-results.txt; then
          echo "✅ All tests passed" >> docs/pr9-remediation/artifacts/final-test-results.txt
      else
          echo "❌ Some tests failed" >> docs/pr9-remediation/artifacts/final-test-results.txt
      fi
      echo "" >> docs/pr9-remediation/artifacts/final-test-results.txt

      # Check for warnings
      echo "Checking for warnings..." >> docs/pr9-remediation/artifacts/final-test-results.txt
      if go test ./... -v 2>&1 | grep -i "warning"; then
          echo "❌ Warnings found in test output" >> docs/pr9-remediation/artifacts/final-test-results.txt
      else
          echo "✅ No warnings in test output" >> docs/pr9-remediation/artifacts/final-test-results.txt
      fi
      echo "" >> docs/pr9-remediation/artifacts/final-test-results.txt

      # Run integration tests
      echo "Running integration tests..." >> docs/pr9-remediation/artifacts/final-test-results.txt
      cd integration && go test -v 2>&1 | tee -a ../docs/pr9-remediation/artifacts/final-test-results.txt
      cd ..
      echo "" >> docs/pr9-remediation/artifacts/final-test-results.txt

      # Check coverage
      echo "Checking test coverage..." >> docs/pr9-remediation/artifacts/final-test-results.txt
      go test ./... -cover | tee -a docs/pr9-remediation/artifacts/final-test-results.txt
      echo "" >> docs/pr9-remediation/artifacts/final-test-results.txt

      # Run quality checks
      echo "Running quality checks..." >> docs/pr9-remediation/artifacts/final-test-results.txt
      go vet ./... 2>&1 | tee -a docs/pr9-remediation/artifacts/final-test-results.txt
      echo "" >> docs/pr9-remediation/artifacts/final-test-results.txt

      echo "Test suite complete: $(date)" >> docs/pr9-remediation/artifacts/final-test-results.txt
      ```

      **Validation:**
      ```bash
      test -f docs/pr9-remediation/artifacts/final-test-results.txt
      grep -q "All tests passed" docs/pr9-remediation/artifacts/final-test-results.txt
      ```
      Expected: All tests pass, no warnings

    validation:
      commands:
        - test -f docs/pr9-remediation/artifacts/final-test-results.txt
        - go test ./... -count=1
      expected_output: "All tests pass"
      on_failure: "Investigate test failures"

  - id: m5-004
    name: "Create remediation summary report"
