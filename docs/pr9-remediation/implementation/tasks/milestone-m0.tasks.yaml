  - id: m0-004
    name: "Add tests for shared StripFrontmatter"
    description: |
      Create comprehensive tests for the shared StripFrontmatter function
      in prompt/frontmatter_test.go
    estimate_minutes: 45
    type: test
    dependencies: [m0-001]
    files:
      create:
        - prompt/frontmatter_test.go
      modify: []
      touch_only: []
    style_anchor_refs:
      - "artifacts/style-anchors/test-cleanup-pattern"
    instructions: |
      **Objective:**
      Create comprehensive test suite for StripFrontmatter function to ensure
      it handles all edge cases correctly.

      **Style Anchor:**
      Follow test pattern in artifacts/style-anchors/test-cleanup-pattern

      **Test Cases to Implement:**
      1. Valid frontmatter (---\nkey: value\n---\nbody)
      2. No frontmatter (body only)
      3. Malformed frontmatter (only opening ---)
      4. Content starting with --- but not frontmatter (---not-frontmatter---)
      5. Empty body after frontmatter
      6. Frontmatter with \r\n line endings (Windows)
      7. Multiple --- occurrences in body (should not be affected)

      **Implementation:**
      ```go
      package prompt

      import (
          "strings"
          "testing"
      )

      func TestStripFrontmatterWithValidFrontmatter(t *testing.T) {
          input := "---\nname: test\n---\n# Body\nContent here."
          got := StripFrontmatter(input)
          if strings.Contains(got, "---") {
              t.Errorf("frontmatter delimiters not stripped: %q", got)
          }
          if !strings.Contains(got, "# Body") {
              t.Errorf("body content missing: %q", got)
          }
      }

      func TestStripFrontmatterNoFrontmatter(t *testing.T) {
          input := "# Just Content\nNo frontmatter here."
          got := StripFrontmatter(input)
          if got != input {
              t.Errorf("content without frontmatter should be unchanged, got: %q", got)
          }
      }

      func TestStripFrontmatterOnlyOpening(t *testing.T) {
          input := "---\nname: test\nNo closing delimiter."
          got := StripFrontmatter(input)
          if got != input {
              t.Errorf("malformed frontmatter should return original, got: %q", got)
          }
      }

      func TestStripFrontmatterContentStartsWithDash(t *testing.T) {
          input := "---not frontmatter---\nSome content"
          got := StripFrontmatter(input)
          if got != input {
              t.Errorf("content starting with --- but not frontmatter unchanged, got: %q", got)
          }
      }

      func TestStripFrontmatterEmptyBody(t *testing.T) {
          input := "---\nname: test\n---\n"
          got := StripFrontmatter(input)
          if got != "" {
              t.Errorf("expected empty string for empty body, got: %q", got)
          }
      }

      func TestStripFrontmatterWindowsLineEndings(t *testing.T) {
          input := "---\r\nname: test\r\n---\r\n# Body"
          got := StripFrontmatter(input)
          if strings.Contains(got, "---") {
              t.Errorf("frontmatter not stripped with CRLF: %q", got)
          }
          if !strings.Contains(got, "# Body") {
              t.Errorf("body missing: %q", got)
          }
      }

      func TestStripFrontmatterMultipleDashes(t *testing.T) {
          input := "---\nname: test\n---\n# Body\n---\nMore dashes in body"
          got := StripFrontmatter(input)
          if !strings.Contains(got, "More dashes in body") {
              t.Errorf("body content with --- should be preserved: %q", got)
          }
      }
      ```

      **Constraints:**
      - ONLY create prompt/frontmatter_test.go
      - Test all edge cases listed above
      - Follow table-driven test pattern if appropriate
      - Use clear, descriptive test names

      **Validation:**
      ```bash
      go test ./prompt/frontmatter_test.go -v
      go test ./prompt/... -cover
      ```
      Expected: All tests pass, coverage > 90%

    validation:
      commands:
        - go test ./prompt/frontmatter_test.go -v
