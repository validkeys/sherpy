    name: "Extract stripFrontmatter to shared utility"
    description: |
      Create prompt/frontmatter.go with stripFrontmatter function extracted from
      the duplicated implementations in registry.go and gen_prompts.go
    estimate_minutes: 45
    type: code
    dependencies: []
    files:
      create:
        - prompt/frontmatter.go
      modify: []
      touch_only: []
    style_anchor_refs:
      - "artifacts/style-anchors/shared-utility-extraction"
    instructions: |
      **Objective:**
      Extract the duplicated stripFrontmatter() function into a new shared file
      to eliminate code duplication between registry.go and gen_prompts.go.

      **Style Anchors:**
      Follow pattern in artifacts/style-anchors/shared-utility-extraction

      Reference implementation:
      - `prompt/registry.go:144-168` - Current implementation to extract
      - `prompt/gen_prompts.go:68-92` - Duplicate to be removed

      **Implementation Steps:**
      1. Create new file: prompt/frontmatter.go
      2. Add package declaration and imports (strings only)
      3. Copy stripFrontmatter implementation from registry.go
      4. Export function by capitalizing: StripFrontmatter
      5. Add comprehensive documentation comment:
         ```go
         // StripFrontmatter removes YAML frontmatter (---\n...\n---) from the
         // beginning of content. Used by both runtime prompt loading and build-time
         // skill embedding to ensure consistent frontmatter handling.
         //
         // Returns the content unchanged if no valid frontmatter is found.
         ```
      6. Implementation should be identical to current version

      **Expected File Structure:**
      ```go
      package prompt

      import "strings"

      // StripFrontmatter removes YAML frontmatter from content
      func StripFrontmatter(content string) string {
          content = strings.TrimSpace(content)

          if !strings.HasPrefix(content, "---") {
              return content
          }

          rest := content[3:]
          if len(rest) > 0 && rest[0] != '\n' {
              return content
          }

          idx := strings.Index(rest, "\n---")
          if idx == -1 {
              return content
          }

          after := rest[idx+4:]
          if len(after) > 0 && after[0] != '\n' && after[0] != '\r' {
              return content
          }

          body := rest[idx+4:]
          return strings.TrimSpace(body)
      }
      ```

      **Constraints:**
      - ONLY create prompt/frontmatter.go
      - Do not modify other files yet (next task)
      - Function must be exported (capital S)
      - Include comprehensive doc comment

      **Validation:**
      ```bash
      # Verify file created
      test -f prompt/frontmatter.go

      # Check it compiles
      go build ./prompt/...
      ```
      Expected: File exists, code compiles

      **Drift Policy:**
      If you discover the implementations differ between registry.go and gen_prompts.go,
      STOP and report the differences before proceeding.

    validation:
      commands:
        - test -f prompt/frontmatter.go
        - go build ./prompt/...
      expected_output: "File exists and compiles successfully"
      on_failure: "Check file path and package declaration"

