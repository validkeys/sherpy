      expected_output: "All tests pass with good coverage"
      on_failure: "Review test implementation and edge cases"

  - id: m0-005
    name: "Add skipList to gen_prompts.go"
    description: |
      Filter non-pipeline skills during generation to eliminate orphaned
      prompt warnings in test output
    estimate_minutes: 30
    type: code
    dependencies: [m0-003]
    files:
      create: []
      modify:
        - prompt/gen_prompts.go
      touch_only: []
    style_anchor_refs:
      - "artifacts/style-anchors/go-generate-filter"
    instructions: |
      **Objective:**
      Add skipList to gen_prompts.go to filter out orchestrator/meta skills
      that shouldn't be embedded in the binary. This eliminates orphaned
      prompt warnings.

      **Style Anchor:**
      Follow filtering pattern in artifacts/style-anchors/go-generate-filter

      **Implementation Steps:**
      1. Read prompt/gen_prompts.go
      2. After collecting skill names (line ~35), add filter logic
      3. Create skipList map with non-pipeline skills:
         - sherpy-cli-planner (orchestrator)
         - sherpy-cli (meta skill)
         - sherpy-flow (orchestrator)
         - implementation-plan-best-practices (meta)
         - create-continuation-prompt (utility)
         - contracted (non-pipeline)
      4. Filter names slice before building generated file

      **Expected Implementation:**
      ```go
      // After: names = append(names, entry.Name())

      // Filter out orchestrator and meta skills
      skipList := map[string]bool{
          "sherpy-cli-planner":              true, // Orchestrator skill
          "sherpy-cli":                      true, // Meta skill
          "sherpy-flow":                     true, // Orchestrator skill
          "implementation-plan-best-practices": true, // Meta/reference skill
          "create-continuation-prompt":      true, // Utility skill
          "contracted":                      true, // Non-pipeline skill
      }

      // Filter names
      var filtered []string
      for _, name := range names {
          if !skipList[name] {
              filtered = append(filtered, name)
          }
      }
      names = filtered

      sort.Strings(names)
      ```

      **Rationale Comment to Add:**
      ```go
      // Only embed pipeline step skills in the binary. Orchestrator skills
      // (sherpy-cli-planner, sherpy-flow) and meta skills reference the
      // pipeline steps but are not themselves pipeline steps, so they
      // don't need to be embedded. This prevents "orphaned content" warnings
      // during test runs.
      ```

      **Constraints:**
      - ONLY modify prompt/gen_prompts.go
      - Add skipList after name collection
      - Include rationale comment
      - Maintain sort.Strings(names) call

      **Validation:**
      ```bash
      # Regenerate content
      cd prompt && go run gen_prompts.go

      # Verify no warnings in tests
      go test ./prompt/... -v 2>&1 | grep -i "orphaned" && exit 1 || exit 0

      # Verify pipeline skills still present
      grep -q "business-requirements-interview" prompt/content_generated.go
      grep -q "implementation-planner" prompt/content_generated.go

      # Verify filtered skills absent
      ! grep -q "sherpy-cli-planner" prompt/content_generated.go
      ```
      Expected: No orphaned warnings, pipeline skills present, filtered skills absent

      **Drift Policy:**
      If regeneration produces unexpected results, STOP and report what changed.

    validation:
      commands:
        - cd prompt && go run gen_prompts.go
        - go test ./prompt/... -v 2>&1 | grep -i "orphaned" && exit 1 || exit 0
        - grep -q "business-requirements-interview" prompt/content_generated.go
        - '! grep -q "sherpy-cli-planner" prompt/content_generated.go'
      expected_output: "No warnings, pipeline skills present, filtered skills absent"
      on_failure: "Review gen_prompts.go logic and regenerate"

