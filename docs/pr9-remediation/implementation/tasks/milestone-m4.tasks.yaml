milestone: m4
name: "CI/CD Automation"
description: "Add GitHub Actions workflow to validate generated content is current"

style_anchors:
  primary:
    - path: "artifacts/style-anchors/github-actions-validation"
      description: "Pattern for CI validation workflows"

global_constraints:
  - "Follow GitHub Actions best practices"
  - "Provide clear error messages for contributors"
  - "Test workflow before committing"

quality_gates:
  pre_commit:
    - "Workflow YAML is valid"
    - "Workflow tested locally if possible"
  ci:
    - "Workflow runs on push and PR"
    - "Fails if content_generated.go is stale"

tasks:
  - id: m4-001
    name: "Create validate-generated.yml workflow"
    description: |
      Create GitHub Actions workflow to check that content_generated.go
      is up-to-date with skills directory
    estimate_minutes: 30
    type: ci
    dependencies: []
    files:
      create:
        - .github/workflows/validate-generated.yml
      modify: []
      touch_only: []
    style_anchor_refs:
      - "artifacts/style-anchors/github-actions-validation"
    instructions: |
      **Objective:**
      Create CI workflow that fails if content_generated.go is stale
      (out of sync with skills files).

      **Style Anchor:**
      Follow pattern in artifacts/style-anchors/github-actions-validation

      **Implementation:**
      ```yaml
      name: Validate Generated Content

      on:
        push:
          branches: [main, feat/**, fix/**]
        pull_request:
          branches: [main]

      jobs:
        check-generated:
          name: Check Generated Files Up-to-Date
          runs-on: ubuntu-latest

          steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                go-version: '1.26'

            - name: Run go generate
              run: make generate

            - name: Check for uncommitted changes
              run: |
                if ! git diff --exit-code prompt/content_generated.go; then
                  echo ""
                  echo "❌ ERROR: content_generated.go is stale!"
                  echo ""
                  echo "The embedded prompt content does not match the skill files."
                  echo ""
                  echo "To fix this:"
                  echo "  1. Run: make generate"
                  echo "  2. Commit: git add prompt/content_generated.go"
                  echo "  3. Push your changes"
                  echo ""
                  echo "This ensures the binary embeds the latest skill content."
                  exit 1
                fi

            - name: Success message
              run: |
                echo "✅ Generated content is up-to-date"
                echo "Skills and embedded content are in sync"
      ```

      **Key Features:**
      - Runs on push to main and feature branches
      - Runs on all pull requests
      - Clear error message for contributors
      - Actionable fix instructions
      - Passes if content matches

      **Constraints:**
      - ONLY create .github/workflows/validate-generated.yml
      - Follow GitHub Actions syntax
      - Use latest action versions
      - Provide helpful error messages

      **Validation:**
      ```bash
      # Verify file created
      test -f .github/workflows/validate-generated.yml

      # Validate YAML syntax
      python3 -c "import yaml; yaml.safe_load(open('.github/workflows/validate-generated.yml'))" || \
        echo "YAML syntax check requires PyYAML"

      # Check required keys present
      grep -q "name: Validate Generated Content" .github/workflows/validate-generated.yml
      grep -q "make generate" .github/workflows/validate-generated.yml
      grep -q "git diff --exit-code" .github/workflows/validate-generated.yml
      ```
      Expected: Workflow file created with validation logic

    validation:
      commands:
        - test -f .github/workflows/validate-generated.yml
        - grep -q "make generate" .github/workflows/validate-generated.yml
      expected_output: "Workflow created successfully"
      on_failure: "Review workflow file syntax"

  - id: m4-002
    name: "Update existing CI workflows if needed"
    description: |
      Check if existing test.yml or similar workflows exist and need
      integration with generate check
    estimate_minutes: 15
    type: ci
    dependencies: [m4-001]
    files:
      create: []
      modify: []
      touch_only:
        - .github/workflows/test.yml
    instructions: |
      **Objective:**
      Check if existing CI workflows need updates to coordinate with
      the new validate-generated workflow.

      **Check for Existing Workflows:**
      ```bash
      # List existing workflows
      ls -la .github/workflows/

      # Check if test.yml exists
      if [ -f .github/workflows/test.yml ]; then
          echo "test.yml exists - review needed"
          cat .github/workflows/test.yml
      else
          echo "No test.yml found - standalone validate-generated is sufficient"
      fi
      ```

      **Review Questions:**
      1. Does test.yml run `make test`?
      2. Does test.yml need to run `make generate` first?
      3. Should validate-generated be a separate job or integrated?

      **Recommendation:**
      - **If test.yml exists and runs tests:**
        - Keep validate-generated as separate workflow (runs first/fast)
        - Add dependency: test job requires validate-generated to pass
      - **If no test.yml exists:**
        - validate-generated.yml is sufficient as standalone

      **Document Findings:**
      Create docs/pr9-remediation/artifacts/ci-integration-notes.txt:

      ```
      CI Integration Assessment
      Date: 2026-05-14

      Existing Workflows:
      [List workflows found in .github/workflows/]

      Integration Decision:
      [Standalone validate-generated.yml | Integrated with test.yml | Other]

      Rationale:
      [Explain why this approach is best]

      Changes Made:
      [None | Updated test.yml | Other]

      Workflow Execution Order:
      1. validate-generated (checks stale content)
      2. test (if exists, runs after validation)
      3. Other checks...
      ```

      **Constraints:**
      - Do not modify existing workflows without documenting reason
      - Prefer separate validate-generated workflow (clearer errors)
      - Document integration approach

      **Validation:**
      ```bash
      test -f docs/pr9-remediation/artifacts/ci-integration-notes.txt
      ```
      Expected: Integration assessed and documented

    validation:
      commands:
        - test -f docs/pr9-remediation/artifacts/ci-integration-notes.txt
      expected_output: "CI integration assessed"
      on_failure: "Document integration approach"

  - id: m4-003
    name: "Test workflow locally if possible"
    description: |
      Test the validate-generated workflow logic locally to ensure it
      works before pushing
    estimate_minutes: 15
    type: ci
    dependencies: [m4-001]
    files:
      create:
        - docs/pr9-remediation/artifacts/workflow-test-results.txt
      modify: []
      touch_only: []
    instructions: |
      **Objective:**
      Test the workflow validation logic locally to catch issues before
      pushing to CI.

      **Test Scenarios:**

      **Scenario 1: Content is current (should pass)**
      ```bash
      echo "Test 1: Current content" > docs/pr9-remediation/artifacts/workflow-test-results.txt
      echo "==============================" >> docs/pr9-remediation/artifacts/workflow-test-results.txt

      # Ensure content is current
      make generate

      # Check diff (should be empty)
      if git diff --exit-code prompt/content_generated.go; then
          echo "✅ PASS: No diff when content current" >> docs/pr9-remediation/artifacts/workflow-test-results.txt
      else
          echo "❌ FAIL: Unexpected diff found" >> docs/pr9-remediation/artifacts/workflow-test-results.txt
      fi

      echo "" >> docs/pr9-remediation/artifacts/workflow-test-results.txt
      ```

      **Scenario 2: Content is stale (should fail)**
      ```bash
      echo "Test 2: Stale content" >> docs/pr9-remediation/artifacts/workflow-test-results.txt
      echo "==============================" >> docs/pr9-remediation/artifacts/workflow-test-results.txt

      # Modify a skill to make content stale
      echo "# Test modification" >> skills/gap-analysis-worksheet/SKILL.md

      # Check diff (should show changes after generate)
      make generate
      if ! git diff --exit-code prompt/content_generated.go; then
          echo "✅ PASS: Diff detected when content stale" >> docs/pr9-remediation/artifacts/workflow-test-results.txt
      else
          echo "❌ FAIL: No diff detected when content should be stale" >> docs/pr9-remediation/artifacts/workflow-test-results.txt
      fi

      # Revert test modification
      git checkout skills/gap-analysis-worksheet/SKILL.md
      make generate
      git checkout prompt/content_generated.go

      echo "" >> docs/pr9-remediation/artifacts/workflow-test-results.txt
      ```

      **Scenario 3: Workflow syntax**
      ```bash
      echo "Test 3: Workflow syntax" >> docs/pr9-remediation/artifacts/workflow-test-results.txt
      echo "==============================" >> docs/pr9-remediation/artifacts/workflow-test-results.txt

      # Test YAML syntax (requires PyYAML)
      if command -v python3 &> /dev/null; then
          if python3 -c "import yaml; yaml.safe_load(open('.github/workflows/validate-generated.yml'))" 2>&1; then
              echo "✅ PASS: Workflow YAML syntax valid" >> docs/pr9-remediation/artifacts/workflow-test-results.txt
          else
              echo "❌ FAIL: Workflow YAML syntax invalid" >> docs/pr9-remediation/artifacts/workflow-test-results.txt
          fi
      else
          echo "⚠️  SKIP: Python3 not available for YAML validation" >> docs/pr9-remediation/artifacts/workflow-test-results.txt
      fi

      echo "" >> docs/pr9-remediation/artifacts/workflow-test-results.txt
      ```

      **Test Summary:**
      ```bash
      echo "Test Summary" >> docs/pr9-remediation/artifacts/workflow-test-results.txt
      echo "==============================" >> docs/pr9-remediation/artifacts/workflow-test-results.txt
      echo "Date: $(date)" >> docs/pr9-remediation/artifacts/workflow-test-results.txt
      echo "" >> docs/pr9-remediation/artifacts/workflow-test-results.txt
      echo "Workflow: .github/workflows/validate-generated.yml" >> docs/pr9-remediation/artifacts/workflow-test-results.txt
      echo "Local tests completed. Review results above." >> docs/pr9-remediation/artifacts/workflow-test-results.txt
      echo "" >> docs/pr9-remediation/artifacts/workflow-test-results.txt
      echo "Next steps:" >> docs/pr9-remediation/artifacts/workflow-test-results.txt
      echo "1. Review test results" >> docs/pr9-remediation/artifacts/workflow-test-results.txt
      echo "2. Commit workflow file" >> docs/pr9-remediation/artifacts/workflow-test-results.txt
      echo "3. Push and verify CI runs correctly" >> docs/pr9-remediation/artifacts/workflow-test-results.txt
      ```

      **Constraints:**
      - Test locally before relying on CI
      - Document all test results
      - Revert any test modifications

      **Validation:**
      ```bash
      test -f docs/pr9-remediation/artifacts/workflow-test-results.txt
      grep -q "Test Summary" docs/pr9-remediation/artifacts/workflow-test-results.txt
      ```
      Expected: Test results documented, tests pass

    validation:
      commands:
        - test -f docs/pr9-remediation/artifacts/workflow-test-results.txt
      expected_output: "Workflow tested locally"
      on_failure: "Run workflow tests manually"

  - id: m4-004
    name: "Comprehensive code review for m4"
    description: |
      Review CI/CD automation implementation
    estimate_minutes: 10
    type: code-review
    dependencies: [m4-001, m4-002, m4-003]
    files:
      create:
        - docs/pr9-remediation/code-reviews/2026-05-14-5-code-review.yaml
      modify: []
      touch_only:
        - .github/workflows/validate-generated.yml
    instructions: |
      **Objective:**
      Review CI workflow implementation and verify FR-7 requirements met.

      **Review Checklist:**
      1. **Workflow Implementation:**
         - [ ] validate-generated.yml created
         - [ ] Runs make generate
         - [ ] Checks for git diff
         - [ ] Fails with clear error message
         - [ ] Provides fix instructions

      2. **Triggers:**
         - [ ] Runs on push to relevant branches
         - [ ] Runs on pull requests
         - [ ] Appropriate branch patterns

      3. **User Experience:**
         - [ ] Error message is clear
         - [ ] Fix steps are actionable
         - [ ] Success message provided

      4. **Testing:**
         - [ ] Workflow tested locally
         - [ ] Test scenarios documented
         - [ ] Results validated

      **Review Process:**
      ```bash
      # Review workflow file
      cat .github/workflows/validate-generated.yml

      # Check triggers
      grep -A 5 "^on:" .github/workflows/validate-generated.yml

      # Check error message
      grep -A 10 "content_generated.go is stale" .github/workflows/validate-generated.yml

      # Review test results
      cat docs/pr9-remediation/artifacts/workflow-test-results.txt
      ```

      **Output Format:**
      ```yaml
      milestone: m4
      milestone_name: "CI/CD Automation"
      review_date: "2026-05-14"
      reviewer: "claude-sonnet-4.5"

      summary:
        files_reviewed: 1
        issues_found: 0
        critical_issues: 0
        overall_quality: "excellent"

      verification:
        - item: "CI workflow created (FR-7)"
          status: "pass"
          evidence: ".github/workflows/validate-generated.yml exists"

        - item: "Generates and checks content"
          status: "pass"
          evidence: "Workflow runs make generate and git diff --exit-code"

        - item: "Clear error messages"
          status: "pass"
          evidence: "Error message provides actionable fix steps"

        - item: "Workflow tested locally"
          status: "pass"
          evidence: "workflow-test-results.txt documents test scenarios"

      strengths:
        - "Clear, actionable error messages for contributors"
        - "Comprehensive workflow testing before commit"
        - "Appropriate triggers (push and PR)"
        - "Prevents stale content from being merged"

      issues: []

      sign_off:
        ready_for_next_milestone: "yes"
        blocking_issues: []
        notes: |
          FR-7 (CI check for generated files) fully addressed. Workflow will
          catch stale content_generated.go and provide clear fix instructions.
          Ready for final validation milestone.
      ```

      **Constraints:**
      - Verify against FR-7 requirement
      - Ensure workflow provides good DX (developer experience)

      **Validation:**
      ```bash
      test -f docs/pr9-remediation/code-reviews/2026-05-14-5-code-review.yaml
      test -f .github/workflows/validate-generated.yml
      ```
      Expected: CI workflow validated, FR-7 complete

    validation:
      commands:
        - test -f docs/pr9-remediation/code-reviews/2026-05-14-5-code-review.yaml
        - test -f .github/workflows/validate-generated.yml
      expected_output: "CI automation complete"
      on_failure: "Address workflow issues"
