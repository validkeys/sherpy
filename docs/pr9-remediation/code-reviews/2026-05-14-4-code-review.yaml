security_assessment:
  policy: "Allow 1 level parent traversal, block 2+"
  rationale: |
    Pragmatic balance between security and legitimate sibling directory access.
    Users need to access documents in sibling directories when sherpy is not
    in the same directory as their YAML files (e.g., sherpy in /usr/local/bin,
    docs in ~/project/docs).

  risk_level: "low"

  risk_factors:
    severity: "low"
    likelihood: "low"
    impact: "information_disclosure_only"

  justification: |
    - Sherpy only reads files (no writes/execution)
    - 10MB file size limit prevents DoS
    - User filesystem permissions still enforced by OS
    - Risk limited to information disclosure of files user can already access
    - 2+ level traversal blocked (covers serious attack vectors like ../../etc/passwd)
    - Multi-layered defense strategy

  attack_scenarios_evaluated:
    - scenario: "Malicious 1-level traversal (../etc/cron.d)"
      mitigation: "Depends on sherpy location, OS permissions still apply"
      risk: "low"

    - scenario: "Multiple .. segments (../../etc/passwd)"
      mitigation: "Blocked by parentCount > 1 check"
      risk: "none"

    - scenario: "Absolute path bypass (/etc/passwd)"
      mitigation: "filepath.Abs() validates, OS permissions apply"
      risk: "low"

    - scenario: "Three+ levels (../../../file)"
      mitigation: "Blocked by parentCount > 1 check"
      risk: "none"

  compliance:
    owasp_top_10_2021:
      category: "A01:2021 Broken Access Control"
      status: "mitigated"
      notes: |
        - Traversal depth restricted to 1 level
        - Filesystem permissions provide defense in depth
        - Read-only operations limit potential damage
        - No privilege escalation possible

    cwe_22:
      category: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory"
      status: "partially_mitigated"
      notes: |
        - Partially mitigated by 1-level limit
        - Full mitigation would require blocking all traversal
        - Trade-off accepted for usability with documented rationale
        - Risk level acceptable given read-only nature and OS permission enforcement

