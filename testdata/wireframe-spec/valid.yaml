            destination: "PAGE-002"
      - id: COMP-002
        name: "Create Button"
        type: navigation
        description: "Button to create new task"
        interactions:
          - trigger: "click"
            action: "Open create modal"

  - id: PAGE-002
    name: "Task Detail"
    route: "/tasks/:id"
    description: "Detailed task view"
    source_requirement: "FR-002"
    components:
      - id: COMP-001
        name: "Task Header"
        type: detail
        description: "Title and status"

